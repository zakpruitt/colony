# Runs the same command a lane runs locally: python tools/dev.py check.
name: Check

on:
  pull_request:
  push:
    branches: [main, dev]
    # A push that only edits specs runs nothing: no check reads them, and the queue is one job wide.
    paths-ignore:
      - "specs/**"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Check
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          python tools/dev.py check
